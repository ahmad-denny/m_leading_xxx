<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Leading Indicator Dashboard - Bank Muamalat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --primary: #4b2e83;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text: #333333;
            --text-muted: #6c757d;
            --border: #e9ecef;
            --shadow: 0 2px 8px rgba(0,0,0,0.06);
            --radius: 8px;
            --success: #28a745;
            --danger: #dc3545;
            --warning: #ffc107;
            --highlight-bg: rgba(75, 46, 131, 0.08);
            --card-title-light: #d4c4f0; 
            --top5-header-color: var(--primary);
            
            --col-rank-w: 40px;
            --col-name-w: 120px;
            --col-total-w: 60px;
            --text-primary: #6a4c9c;
        }

        [data-theme="dark"] {
            --primary: #6a4c9c;
            --bg: #1a1a2e;
            --card-bg: #16213e;
            --text: #e0e0e0;
            --text-muted: #a0a0a0;
            --border: #2a2a40;
            --shadow: 0 2px 8px rgba(0,0,0,0.3);
            --highlight-bg: rgba(106, 76, 156, 0.2);
            --sort-modal-bg: #1e293b;
            --sort-item-border: #334155;
            --sort-text-color: #e2e8f0;
            --sort-icon-color: #a78bfa;
            --top5-header-color: #ffffff;
            --text-primary: #D4C4F0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; transition: background-color 0.3s, color 0.3s; }
        
        body.modal-open { overflow: hidden; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding-top: 150px; user-select: none;}

        .main-content { display: none; }

        /* HEADER FIXED & LEFT ALIGNED */
        .header { 
            background: linear-gradient(135deg, var(--primary), #2d1b50); 
            color: white; 
            padding: 10px 20px 0 20px; 
            position: fixed; 
            top: 0; left: 0; right: 0; 
            z-index: 100; 
            display: flex; 
            flex-direction: column; 
            align-items: flex-start; 
            justify-content: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); 
            min-height: 110px; 
        }
        
        .header-content-wrapper { 
            position: relative; 
            width: 100%; 
            max-width: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding-right: 10px; 
        }

        .header-left-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0; 
        }

        .header h1 { 
            font-size: 1.4rem; 
            margin-bottom: 0; 
            display: flex; 
            align-items: center; 
            justify-content: flex-start; 
            gap: 10px; 
            text-align: left; 
            line-height: 1.1; 
            flex: 1; 
        }
        .header h1 img.logo { object-fit: contain; vertical-align: middle; margin-top: -2px; }
        .header p { font-size: 0.85rem; opacity: 0.9; margin: 4px 0 0 0; text-align: left; }
        
        .data-tabs-container { width: 100%; display: flex; justify-content: flex-start; margin-top: 10px; margin-bottom: 0; gap: 0; overflow-x: auto; padding-bottom: 0; }
        .data-tab-btn { padding: 8px 16px; background: rgba(0, 0, 0, 0.15); color: rgba(255, 255, 255, 0.8); border: 1px solid transparent; border-bottom: 1px solid transparent; border-radius: 4px 4px 0 0; cursor: pointer; font-size: 0.8rem; font-weight: 600; white-space: nowrap; transition: all 0.2s ease; margin-right: 5px; display: inline-flex; align-items: center; }
        .data-tab-btn:hover { background: rgba(255, 255, 255, 0.15); color: #ffffff; }
        .data-tab-btn.active { padding: 8px 16px; border: 1px solid var(--card-bg); border-bottom: none; background: var(--card-bg); color: var(--primary); border-radius: 4px 4px 0 0; font-weight: bold; position: relative; z-index: 2; }
        [data-theme="dark"] .data-tab-btn.active { background: #16213e !important; color: #ffffff !important; border: 1px solid #16213e !important; border-bottom: none !important; font-weight: bold; }
        
        .header-actions { display: flex; align-items: center; gap: 10px; z-index: 101; flex-shrink: 0; }
        .theme-toggle, .filter-toggle, .capture-toggle, .menu-toggle { background: rgba(255,255,255,0.15); border: none; color: white; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.9em; flex-shrink: 0; transition: background 0.2s; }
        .theme-toggle:hover, .filter-toggle:hover, .capture-toggle:hover, .menu-toggle:hover { background: rgba(255,255,255,0.25); }
        .filter-toggle.active { background: var(--warning); color: #333; }
        
        .controls { display: none; align-items: center; padding: 15px 20px; background: var(--card-bg); margin: -1px 20px 15px 20px; border-radius: 0 0 var(--radius) var(--radius); box-shadow: var(--shadow); gap: 5px; flex-wrap: nowrap; animation: slideDown 0.3s ease; position: relative; z-index: 10; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .filter-group { display: flex; gap: 10px; flex: 2; min-width: 0; } 
        select { padding: 8px 12px; border: 1px solid var(--border); border-radius: 4px; flex: 1; background: var(--card-bg); color: var(--text); min-width: 0; font-size: 0.85rem; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
        .btn-ranking { background: green; color: white; flex: 1; justify-content: center; flex-shrink: 0; } 
        .btn-reset { background: var(--warning); color: #333; flex: 1; justify-content: center; } 
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }

        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; padding: 0 20px 20px 20px; margin-top: -2px; position: relative; z-index: 10; }
        .card { background: var(--card-bg); padding: 16px; border-radius: var(--radius); box-shadow: var(--shadow); display: flex; flex-direction: column; }        
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .card-title { font-size: 0.95rem; font-weight: bold; color: var(--primary); display: flex; align-items: center; gap: 6px; }
        [data-theme="dark"] .card-title { color: var(--card-title-light); }
        .badge-mtd { font-size: 0.75rem; background: var(--border); padding: 2px 6px; border-radius: 4px; color: var(--text-muted); }
        .metric-row { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 8px; color: var(--text-muted); align-items: center; }
        .metric-val { font-weight: 600; color: var(--text); font-size: 0.85rem; }
        .metric-val.neg { color: var(--danger); }
        .metric-val.pos { color: var(--success); }
        .achievement-box { margin-top: auto; text-align: center; padding-top: 10px; border-top: 1px dashed var(--border); }
        .achv-val { font-size: 1.5rem; font-weight: bold; margin-bottom: 6px; }
        .progress-bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; width: 100%; }
        .progress-fill { height: 100%; background: var(--primary); transition: width 0.5s ease; }
        
        .footer { text-align: center; padding: 10px; font-size: 0.75rem; color: var(--text-muted); margin-top: 3px; }

        /* DETAILED BREAKDOWN TABLE STYLES */
        .breakdown-container { padding: 0 20px 40px 20px; }
        .breakdown-card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
        .breakdown-header { font-weight: bold; padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .breakdown-title { font-size: 1rem; font-weight: bold; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
        .table-responsive { overflow-x: auto; width: 100%; -webkit-overflow-scrolling: touch; }
        .detail-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; white-space: nowrap; table-layout: fixed; }
        .detail-table th, .detail-table td { padding: 10px 8px; text-align: right; border-bottom: 1px solid var(--border); overflow: hidden; text-overflow: ellipsis; }
        .detail-table th:nth-child(1), .detail-table td:nth-child(1) { width: 40px; min-width: 40px; }
        .detail-table th:nth-child(2), .detail-table td:nth-child(2) { width: 100px; min-width: 100px; }
        .detail-table th:nth-child(3), .detail-table td:nth-child(3) { width: 130px; min-width: 130px; }
        .detail-table th:nth-child(4), .detail-table td:nth-child(4) { width: 70px; min-width: 70px; }
        .detail-table th:first-child, .detail-table td:first-child,
        .detail-table th:nth-child(2), .detail-table td:nth-child(2),
        .detail-table th:nth-child(3), .detail-table td:nth-child(3),
        .detail-table th:nth-child(4), .detail-table td:nth-child(4) { text-align: left; position: sticky; background: var(--card-bg); z-index: 10; border-right: 1px solid var(--border); }
        .detail-table th:first-child, .detail-table td:first-child { left: 0; z-index: 11; }
        .detail-table th:nth-child(2), .detail-table td:nth-child(2) { left: 40px; z-index: 11; }
        .detail-table th:nth-child(3), .detail-table td:nth-child(3) { left: 140px; z-index: 11; }
        .detail-table th:nth-child(4), .detail-table td:nth-child(4) { left: 270px; z-index: 11; border-right: 1px solid var(--border); }
        .detail-table th { background: var(--bg); color: var(--text-muted); font-weight: 600; position: sticky; top: 0; z-index: 5; }
        .detail-table tr.total-row { background-color: var(--highlight-bg); font-weight: bold; }
        .detail-table tr.total-row td:first-child { position: sticky; left: 0; background: var(--highlight-bg); z-index: 11; border-right: 1px solid var(--border); }
        .detail-table tr.total-row td:nth-child(2) { position: sticky; left: 40px; background: var(--highlight-bg); z-index: 11; border-right: 1px solid var(--border); }
        .detail-table tr.total-row td:nth-child(3) { position: sticky; left: 140px; background: var(--highlight-bg); z-index: 11; border-right: 1px solid var(--border); text-align: right !important; }
        .detail-table tr.total-row td:nth-child(4) { position: sticky; left: 270px; background: var(--highlight-bg); z-index: 11; border-right: 1px solid var(--border); }
        .detail-table tr:hover td { background-color: rgba(0,0,0,0.02); }
        [data-theme="dark"] .detail-table tr:hover td { background-color: rgba(255,255,255,0.05); }

        /* MODAL & RANKING STYLES */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--card-bg); width: 95%; max-width: 1200px; height: auto; max-height: 85vh; border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; animation: slideUp 0.3s ease; color: var(--text); }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .modal-header { 
            background: var(--primary); 
            color: white; 
            padding: 12px 15px 0 15px; 
            display: flex; 
            align-items: flex-end; 
            flex-shrink: 0; 
            position: relative;
        }
        
        .modal-capture-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            margin-left: auto;
            margin-right: 10px;
            margin-bottom: 8px;
            transition: background 0.2s;
        }
        .modal-capture-btn:hover { background: rgba(255,255,255,0.35); }
        
        .close-btn { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; display: flex; align-self: center; margin-left: 0; padding-bottom: 10px; }
        .modal-body { padding: 0; overflow-y: auto; flex: 1; display: flex; flex-direction: column; position: relative; }
        .tab-btn { padding: 8px 16px; background: rgba(0, 0, 0, 0.15); color: rgba(255, 255, 255, 0.8); border: 1px solid transparent; border-radius: 4px 4px 0 0; cursor: pointer; font-size: 0.8rem; display: inline-flex; align-items: center; margin-right: 5px; }
        .tab-btn.active { padding: 8px 16px; border: 1px solid var(--card-bg); border-bottom: 1px solid white; background: var(--card-bg); color: var(--primary); border-radius: 4px 4px 0 0; }
        .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; width: 100%; flex: 1; position: relative; }
        .ranking-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.8rem; min-width: 800px; }
        .ranking-table th { background: var(--bg); padding: 0; text-align: center; border-bottom: 2px solid var(--border); position: sticky; top: 0; z-index: 5; color: var(--text); vertical-align: middle; height: 55px; }
        .th-content { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 8px 4px; height: 100%; box-sizing: border-box; position: relative; }
        .indicator-prefix { font-size: 0.6rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; line-height: 1; }
        .ranking-table td { padding: 10px 4px; border-bottom: 1px solid var(--border); color: var(--text); text-align: center; white-space: nowrap; background: var(--card-bg); }
        .ranking-table th:first-child, .ranking-table td:first-child { position: sticky; left: 0; z-index: 30; width: var(--col-rank-w); min-width: var(--col-rank-w); max-width: var(--col-rank-w); border-right: 1px solid var(--border); background: var(--card-bg); }
        .ranking-table th:nth-child(2), .ranking-table td:nth-child(2) { position: sticky; left: var(--col-rank-w); z-index: 25; width: var(--col-name-w); min-width: var(--col-name-w); max-width: var(--col-name-w); text-align: left !important; border-right: 1px solid var(--border); overflow: hidden; text-overflow: ellipsis; background: var(--card-bg); }
        .ranking-table th:nth-child(3), .ranking-table td:nth-child(3) { position: sticky; left: calc(var(--col-rank-w) + var(--col-name-w)); z-index: 20; font-weight: bold; background: var(--card-bg); border-right: 2px solid var(--primary); width: var(--col-total-w); min-width: var(--col-total-w); max-width: var(--col-total-w); font-size: 0.75rem; box-shadow: 2px 0 5px -2px rgba(0,0,0,0.1); padding-right: 4px !important; }
        .top5-grid-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; padding: 15px; overflow-y: auto; width: 100%; }
        .top5-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
        .top5-header { display: flex; align-items: center; gap: 5px; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px dashed var(--border); color: var(--top5-header-color); font-weight: bold; font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .top5-item { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; font-size: 0.7rem; border-bottom: 1px solid rgba(0,0,0,0.05); min-width: 0; }
        .top5-item:last-child { border-bottom: none; }
        .top5-rank { width: 16px; height: 16px; background: var(--bg); border-radius: 50%; text-align: center; line-height: 16px; font-size: 0.6rem; font-weight: bold; color: var(--text-muted); margin-right: 5px; flex-shrink: 0; }
        .top5-item:nth-child(1) .top5-rank { background: #ffd700; color: #333; }
        .top5-item:nth-child(2) .top5-rank { background: #c0c0c0; color: #333; }
        .top5-item:nth-child(3) .top5-rank { background: #cd7f32; color: white; }
        .top5-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 5px; font-size: 0.65rem; min-width: 0; }
        .top5-val { font-weight: bold; color: var(--text); font-size: 0.65rem; flex-shrink: 0; }

        /* SIDEBAR MOBILE STYLES */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .sidebar-overlay.active {
            display: block;
            opacity: 1;
        }
        
        .sidebar {
            position: fixed;
            top: 0;
            left: -100%;
            width: 85%;
            max-width: 320px;
            height: 100%;
            background: var(--card-bg);
            z-index: 1000;
            transition: left 0.3s ease;
            overflow-y: auto;
            box-shadow: 2px 0 10px rgba(0,0,0,0.2);
        }
        
        .sidebar.active {
            left: 0;
        }
        
        .sidebar-header {
            background: linear-gradient(135deg, var(--primary), #2d1b50);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .sidebar-header h3 {
            font-size: 1.1rem;
            margin: 0;
        }
        
        .sidebar-close {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .sidebar-content {
            padding: 20px;
        }
        
        .sidebar-section {
            margin-bottom: 25px;
        }
        
        .sidebar-section-title {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        [data-theme="dark"] .sidebar-section-title {
            color: var(--card-title-light);
        }
        
        .sidebar-user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            background: var(--bg);
            border-radius: var(--radius);
            margin-bottom: 15px;
        }
        
        .sidebar-user-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            flex-shrink: 0;
        }
        
        .sidebar-user-details {
            flex: 1;
        }
        
        .sidebar-user-name {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 3px;
        }
        
        .sidebar-user-position {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        
        .sidebar-filter-group {
            margin-bottom: 12px;
        }
        
        .sidebar-filter-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 5px;
            display: block;
        }
        
        .sidebar select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--card-bg);
            color: var(--text);
            font-size: 0.85rem;
        }
        
        .sidebar-btn {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .sidebar-btn-reset {
            background: var(--warning);
            color: #333;
        }
        
        .sidebar-btn-ranking {
            background: var(--success);
            color: white;
        }
        
        .sidebar-divider {
            height: 1px;
            background: var(--border);
            margin: 20px 0;
        }

        @media (max-width: 900px) {
            .header { 
                padding: 8px 15px 0 15px; 
                min-height: 100px; 
            }
            .header-content-wrapper {
                align-items: center; 
            }
            .header-left-group {
                gap: 8px; 
            }
            .header h1 { 
                font-size: 1.1rem; 
                gap: 6px; 
                margin-bottom: 0;
            }
            .header h1 img.logo {
                width: 24px !important;
                height: 24px !important;
            }
            .header p {
                font-size: 0.75rem;
                margin-top: 2px;
            }
            .theme-toggle, .filter-toggle, .capture-toggle, .menu-toggle { 
                width: 30px; 
                height: 30px; 
                font-size: 0.85rem; 
            }
            body { padding-top: 130px; } 
            .controls { display: none !important; }
            .dashboard-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 10px 20px 10px; }
            .card { padding: 12px; }
            .top5-grid-container { grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 10px; }
            .breakdown-container { display: none !important; }
            .modal-capture-btn { width: 28px; height: 28px; font-size: 0.75rem; margin-bottom: 6px; }
            
            /* Sembunyikan user info chip di header pada mobile */
            #userInfoChip { display: none !important; }
            
            /* Fix untuk mobile: pastikan modal tidak punya transform saat capture */
            .modal-content { transform: none !important; animation: none !important; }
            
            /* Mencegah select memicu event penutupan sidebar */
            .sidebar select {
                position: relative;
                z-index: 1002;
            }
        }

        [data-theme="dark"] .tab-btn { background: rgba(255, 255, 255, 0.08) !important; color: rgba(255, 255, 255, 0.5) !important; border: 1px solid rgba(255, 255, 255, 0.1) !important; }
        [data-theme="dark"] .tab-btn.active { background: #16213e !important; color: #ffffff !important; border: 1px solid #16213e !important; font-weight: bold; }
    </style>
</head>
<body oncontextmenu="return false;" onkeydown="return blockShortcuts(event);" ondragstart="return false;">

    <!-- AUTH GATE -->
    <script>
    (function () {
        var LOGIN_PAGE_URL = 'https://bmisumatera.vercel.app/index.html';
        var SESSION_KEY = 'mleadingind_auth_nik';
        var USER_LIST_URL = 'user_list.json';

        function goToLogin() { window.location.replace(LOGIN_PAGE_URL); }

        function validateSession() {
            var params = new URLSearchParams(window.location.search);
            var nikFromUrl = params.get('auth_nik');
            var nik = nikFromUrl || localStorage.getItem(SESSION_KEY);

            if (!nik) { goToLogin(); return; }

            fetch(USER_LIST_URL, { cache: 'no-store' })
                .then(function (res) {
                    if (!res.ok) throw new Error('Gagal memuat user_list.json');
                    return res.json();
                })
                .then(function (data) {
                    var userList = Array.isArray(data.user_list) ? data.user_list : [];
                    var user = userList.find(function (u) { return String(u.nik).trim() === String(nik).trim(); });

                    if (!user) { localStorage.removeItem(SESSION_KEY); goToLogin(); return; }

                    localStorage.setItem(SESSION_KEY, String(user.nik));

                    if (nikFromUrl) {
                        params.delete('auth_nik'); params.delete('auth_ts');
                        var qs = params.toString();
                        var newUrl = window.location.pathname + (qs ? '?' + qs : '');
                        window.history.replaceState({}, document.title, newUrl);
                    }

                    document.dispatchEvent(new CustomEvent('authReady', { detail: user }));
                })
                .catch(function (err) { console.error('Auth check failed:', err); goToLogin(); });
        }

        validateSession();
    })();
    </script>

            document.getElementById('sidebarMenu').classList.remove('active');

        function populateSidebarFilters() {

        }

            // Ambil nilai TERBARU dari dropdown sidebar saat tombol X ditekan
            const coVal = document.getElementById('sidebarCoBranchFilter').value;
            const brVal = document.getElementById('sidebarBranchFilter').value;

            const mainCoSelect = document.getElementById('coBranchFilter');
            const mainBrSelect = document.getElementById('branchFilter');
            
            mainCoSelect.value = coVal;
            
            // Penting: Isi ulang opsi branch utama jika berubah, lalu set nilainya

                [...brSet].sort().forEach(br => { 
                    mainBrSelect.innerHTML += `<option value="${br}">${br}</option>`;

            } else {
                mainBrSelect.innerHTML = '<option value="">Select Branch</option>';

            mainBrSelect.value = brVal;
            
            // Jalankan filtering dan update dashboard
            applyFilters(); 
            
            // Tutup sidebar
            closeSidebar();

        function resetSidebarFilters() {
            document.getElementById('sidebarCoBranchFilter').value = "";
            document.getElementById('sidebarBranchFilter').innerHTML = '<option value="">Select Branch</option>';
            
            // Sync dengan filter utama
            document.getElementById('coBranchFilter').value = "";
            document.getElementById('branchFilter').innerHTML = '<option value="">Select Branch</option>';
            
            resetFilters();
            closeSidebar();
        }

        document.addEventListener('authReady', function (e) {
            var user = e.detail;
            if (user) {
                var nameEl = document.getElementById('userNameChip');
                var posEl = document.getElementById('userPosChip');
                var avatarEl = document.getElementById('userAvatarCircle');
                var displayName = user.nama || 'User';
                var displayPos = user.posisi || '-';

                if (nameEl) nameEl.textContent = displayName;
                if (posEl) posEl.textContent = displayPos;
                if (avatarEl) avatarEl.textContent = displayName.charAt(0).toUpperCase();
                
                var sidebarNameEl = document.getElementById('sidebarUserName');
                var sidebarPosEl = document.getElementById('sidebarUserPosition');
                var sidebarAvatarEl = document.getElementById('sidebarUserAvatar');
                
                if (sidebarNameEl) sidebarNameEl.textContent = displayName;
                if (sidebarPosEl) sidebarPosEl.textContent = displayPos;
                if (sidebarAvatarEl) sidebarAvatarEl.textContent = displayName.charAt(0).toUpperCase();
            }

            document.getElementById('mainContentWrapper').style.display = 'block';
            renderDataTabs();
            loadJsonData(currentActiveJson);
        });

        function renderDataTabs() {
            const container = document.getElementById('dataTabsContainer');
            container.innerHTML = '';
            jsonFiles.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.className = `data-tab-btn ${index === 0 ? 'active' : ''}`;
                btn.innerText = item.label;
                btn.onclick = () => switchJsonTab(item, btn);
                container.appendChild(btn);
            });
        }

        async function switchJsonTab(jsonItem, element) {
            document.querySelectorAll('.data-tab-btn').forEach(b => b.classList.remove('active'));
            element.classList.add('active');
            currentActiveJson = jsonItem;
            const savedCo = document.getElementById('coBranchFilter').value;
            const savedBr = document.getElementById('branchFilter').value;
            await loadJsonData(jsonItem);
            const coSelect = document.getElementById('coBranchFilter');
            const brSelect = document.getElementById('branchFilter');
            let coExists = false;
            for (let i = 0; i < coSelect.options.length; i++) { if (coSelect.options[i].value === savedCo) { coExists = true; break; } }
            if (coExists && savedCo !== "") {
                coSelect.value = savedCo;
                handleCoBranchChange(false);
                let brExists = false;
                for (let i = 0; i < brSelect.options.length; i++) { if (brSelect.options[i].value === savedBr) { brExists = true; break; } }
                if (brExists) brSelect.value = savedBr; else brSelect.value = "";
                applyFilters();
            } else {
                coSelect.value = "";
                brSelect.innerHTML = '<option value="">Select Branch</option>';
                updateHeaderSubtitle();
                renderDashboard(rawData);
            }
        }

        async function loadJsonData(jsonItem) {
            const container = document.getElementById('dashboardContainer');
            container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);"><i class="fas fa-spinner fa-spin fa-2x"></i><br><br>Memuat data ${jsonItem.label}...</div>`;
            document.getElementById('headerMeta').innerHTML = jsonItem.meta;
            try {
                const res = await fetch(jsonItem.file);
                if (!res.ok) throw new Error(`File ${jsonItem.file} tidak ditemukan`);
                rawData = await res.json();
                if (!Array.isArray(rawData)) throw new Error("Format JSON tidak valid");
                rawData = rawData.map(item => {
                    const clean = {};
                    Object.keys(item).forEach(k => { const val = item[k]; clean[k.trim()] = (typeof val === 'string') ? val.trim() : val; });
                    return clean;
                });
                populateCoBranchFilter();
                populateSidebarFilters();
                if(document.getElementById('coBranchFilter').value === "" && document.getElementById('branchFilter').value === "") renderDashboard(rawData);
            } catch (err) {
                container.innerHTML = `<div style="color:var(--danger); text-align:center; padding:20px;">Error: ${err.message}</div>`;
            }
        }

        function initTheme() {
            const saved = localStorage.getItem('bm_theme');
            if (saved === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); document.getElementById('themeIcon').className = 'fas fa-sun'; }
        }

        function toggleTheme() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) { document.documentElement.removeAttribute('data-theme'); document.getElementById('themeIcon').className = 'fas fa-moon'; localStorage.setItem('bm_theme', 'light'); } 
            else { document.documentElement.setAttribute('data-theme', 'dark'); document.getElementById('themeIcon').className = 'fas fa-sun'; localStorage.setItem('bm_theme', 'dark'); }
        }

            const controls = document.getElementById('filterControls');
            const btn = document.querySelector('.filter-toggle');
            const icon = document.getElementById('filterIcon');
            if (controls.style.display === 'none' || controls.style.display === '') {
                controls.style.display = 'flex'; btn.classList.add('active'); icon.className = 'fas fa-times';
            } else {
                controls.style.display = 'none'; btn.classList.remove('active'); icon.className = 'fas fa-filter';

        function populateCoBranchFilter() {
            const coSelect = document.getElementById('coBranchFilter');
            const currentVal = coSelect.value;
            coSelect.innerHTML = '<option value="">Select Co-Branch</option>';
            const coSet = new Set(rawData.map(d => d['co']).filter(Boolean));
            [...coSet].sort().forEach(co => { coSelect.innerHTML += `<option value="${co}">${co}</option>`; });
            if([...coSet].includes(currentVal)) coSelect.value = currentVal;
        }

        function handleCoBranchChange(shouldApplyFilter = true) {
            const coVal = document.getElementById('coBranchFilter').value;
            const brSelect = document.getElementById('branchFilter');
            const currentBrVal = brSelect.value;
            brSelect.innerHTML = '<option value="">Select Branch</option>';
            if (coVal) {
                const brSet = new Set(rawData.filter(d => d['co'] === coVal).map(d => d['br']).filter(Boolean));
                [...brSet].sort().forEach(br => { brSelect.innerHTML += `<option value="${br}">${br}</option>`; });

            }
            if(shouldApplyFilter) applyFilters();
        }

        function applyFilters() {
            const coVal = document.getElementById('coBranchFilter').value;
            const brVal = document.getElementById('branchFilter').value;
            currentFilterState = { co: coVal, branch: brVal };
            updateHeaderSubtitle();
            let filtered = rawData;
            if (coVal) filtered = filtered.filter(d => d['co'] === coVal);
            if (brVal) filtered = filtered.filter(d => d['br'] === brVal);
            renderDashboard(filtered);
        }

        function resetFilters() {
            document.getElementById('coBranchFilter').value = "";
            document.getElementById('branchFilter').innerHTML = '<option value="">Select Branch</option>';
            currentFilterState = { co: "", branch: "" };
            updateHeaderSubtitle();
            renderDashboard(rawData);
        }

        function updateHeaderSubtitle() {
            const coVal = document.getElementById('coBranchFilter').value;
            const brVal = document.getElementById('branchFilter').value;
            const subtitleEl = document.getElementById('headerSubtitle');
            if (brVal) subtitleEl.innerText = brVal;
            else if (coVal) subtitleEl.innerText = "Co-Branch " + coVal;
            else subtitleEl.innerText = "Region Sumatera";
        }

        function formatValue(val, unit, isGrowthType = false, isTarget = false, isGap = false) {
            let prefix = '';
            if (isTarget) prefix = ''; 
            else if ((isGrowthType || isGap) && val > 0) { if (!isGap) prefix = '+'; } 
            let displayVal = isGap ? Math.abs(val) : val;
            if (unit === 'M') {
                if (isTarget) return prefix + displayVal.toLocaleString('id-ID', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' M';
                if (displayVal === 0) return prefix + '0 M';
                return prefix + displayVal.toLocaleString('id-ID', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' M';
            } else { return prefix + Math.round(displayVal).toLocaleString('id-ID'); }
        }
        
        function renderDashboard(data) {
            const container = document.getElementById('dashboardContainer');
            container.innerHTML = '';
            if (data.length === 0) {
                container.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:20px; color:var(--text-muted);">Tidak ada data.</div>';
                renderDetailTable([]); return;
            }
            const coVal = document.getElementById('coBranchFilter').value;
            const brVal = document.getElementById('branchFilter').value;
            const isRegionView = (coVal === "" && brVal === "");
            const agg = {};
            metrics.forEach(m => { agg[m.key + '_mtd'] = 0; agg[m.key + '_tgt'] = 0; });
            data.forEach(row => { metrics.forEach(m => { agg[m.key + '_mtd'] += parseFloat(row[m.key + '_mtd'] || 0); agg[m.key + '_tgt'] += parseFloat(row[m.key + '_tgt'] || 0); }); });
            const SME_TARGET_REGION = 50; 
            if (isRegionView) { agg['sme_tgt'] = SME_TARGET_REGION; }
            metrics.forEach(m => {
                const mtd = agg[m.key + '_mtd'];
                let tgt = agg[m.key + '_tgt'];
                let gap = tgt > 0 ? tgt - mtd : mtd - tgt;
                let achv = 0;
                if (tgt > 0) achv = (mtd / tgt) * 100; else if (mtd > 0) achv = (mtd / 1) * 100; 
                let achvDisplay = achv.toFixed(1) + '%';
                let barWidth = Math.min(Math.max(achv, 0), 100);
                const isNegGrowth = (m.key === 'ca' || m.key === 'sa' || m.key === 'fu') && mtd < 0;
                const growthClass = isNegGrowth ? 'neg' : 'pos';
                const isGrowthType = ['ca', 'sa', 'fu'].includes(m.key);
                const formattedMtd = formatValue(mtd, m.unit, isGrowthType, false, false);
                const formattedTgt = formatValue(tgt, m.unit, false, true, false);
                const formattedGap = formatValue(gap, m.unit, false, false, true);
                const gapLabel = ['ca','sa','fu'].includes(m.key) ? 'Growth GAP' : ['con','sme','ph','sli'].includes(m.key) ? 'Booking GAP' : 'Akuisisi GAP';
                container.innerHTML += `
                    <div class="card">
                        <div class="card-header"><span class="card-title"><i class="fas ${m.icon}"></i> ${m.label}</span><span class="badge-mtd">MTD</span></div>
                        <div class="metric-row"><span>${m.type}</span><span class="metric-val ${growthClass}">${formattedMtd}</span></div>
                        <div class="metric-row"><span>MTD Target</span><span class="metric-val">${formattedTgt}</span></div>
                        <div class="metric-row"><span>${gapLabel}</span><span class="metric-val" style="color: var(--danger);">${formattedGap}</span></div>
                        <div class="achievement-box">
                            <div class="achv-val" style="color: ${achv >= 80 ? 'var(--success)' : achv >= 50 ? 'var(--warning)' : 'var(--danger)'};">${achvDisplay}</div>
                            <div class="progress-bar"><div class="progress-fill" style="background-color: ${achv >= 80 ? 'var(--success)' : achv >= 50 ? 'var(--warning)' : 'var(--danger)'}; width: ${barWidth}%"></div></div>
                        </div>
                    </div>`;
            });
            renderDetailTable(data);
        }

        function renderDetailTable(data) {
            const section = document.getElementById('breakdownSection');
            const thead = document.getElementById('detailTableHead');
            const tbody = document.getElementById('detailTableBody');
            if (!data || data.length === 0) { section.style.display = 'none'; return; }
            section.style.display = 'block';
            thead.innerHTML = ''; tbody.innerHTML = '';
            let headerHTML = '<th>No</th><th>Co-Branch</th><th>Branch</th><th>Type</th>';
            metrics.forEach(m => { headerHTML += `<th>${m.label}</th>`; });
            thead.innerHTML = headerHTML;
            let totals = {}; metrics.forEach(m => totals[m.key] = 0);
            data.forEach((row, index) => {
                let rowHTML = `<tr>`;
                rowHTML += `<td>${index + 1}</td>`;
                rowHTML += `<td>${row['co'] || '-'}</td>`;
                rowHTML += `<td>${row['br'] || '-'}</td>`;
                rowHTML += `<td>${row['tp'] || '-'}</td>`;
                metrics.forEach(m => {
                    let val = parseFloat(row[m.key + '_mtd'] || 0); 
                    totals[m.key] += val; 
                    const isGrowthType = ['ca', 'sa', 'fu'].includes(m.key);
                    const isNegGrowth = isGrowthType && val < 0;
                    const formatted = formatValue(val, m.unit, isGrowthType, false, false);
                    let colorClass = '';
                    if (isGrowthType) { colorClass = isNegGrowth ? 'neg' : 'pos'; }
                    rowHTML += `<td class="metric-val ${colorClass}">${formatted}</td>`;
                });
                rowHTML += `</tr>`; 
                tbody.innerHTML += rowHTML;
            });
            let totalRowHTML = `<tr class="total-row">`;
            totalRowHTML += `<td></td><td></td><td></td><td style="text-align: right;">TOTAL</td>`; 
            metrics.forEach(m => {
                const isGrowthType = ['ca', 'sa', 'fu'].includes(m.key);
                const isNegGrowth = isGrowthType && totals[m.key] < 0;
                const formatted = formatValue(totals[m.key], m.unit, isGrowthType, false, false);
                let colorClass = '';
                if (isGrowthType) { colorClass = isNegGrowth ? 'neg' : 'pos'; }
                totalRowHTML += `<td class="metric-val ${colorClass}">${formatted}</td>`;
            });
            totalRowHTML += `</tr>`; 
            tbody.innerHTML += totalRowHTML;
        }

        function openRankingModal() { document.getElementById('rankingModal').style.display = 'flex'; document.body.classList.add('modal-open'); setRankingTab('top5branch', document.getElementById('tabTop5Branch')); }
        function closeRankingModal() { document.getElementById('rankingModal').style.display = 'none'; document.body.classList.remove('modal-open'); }
        function setRankingTab(mode, btn) {
            currentRankingMode = mode;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            if (mode === 'top5branch') top5Level = 'branch'; else if (mode === 'top5cobranch') top5Level = 'co';
            renderRanking();
        }
        function renderRanking() {
            const thead = document.getElementById('rankingThead'); const tbody = document.getElementById('rankingTableBody');
            thead.innerHTML = ''; tbody.innerHTML = ''; 
            let gridContainer = document.getElementById('top5GridContainer');
            if (!gridContainer) { gridContainer = document.createElement('div'); gridContainer.id = 'top5GridContainer'; gridContainer.className = 'top5-grid-container'; document.querySelector('.table-wrapper').appendChild(gridContainer); }
            document.querySelector('.ranking-table').style.display = 'none'; gridContainer.style.display = 'grid'; gridContainer.innerHTML = '';
            if (top5Level === 'branch') {
                metrics.forEach(m => {
                    let branchData = rawData.map(d => ({ name: d['br'], sub: d['co'], val: parseFloat(d[m.key + '_mtd'] || 0) }));
                    branchData = branchData.filter(item => item.val > 0); branchData.sort((a, b) => b.val - a.val); const topN = branchData.slice(0, 5);
                    if (topN.length === 0) return;
                    let cardHTML = `<div class="top5-card"><div class="top5-header" title="${m.label}"><i class="fas ${m.icon}"></i> ${m.label}</div><div class="top5-list">`;
                    topN.forEach((item, idx) => {
                        const isGrowth = ['ca','sa','fu'].includes(m.key); const formatted = formatValue(item.val, m.unit, isGrowth, false, false);
                        cardHTML += `<div class="top5-item"><div style="display:flex; align-items:center; overflow:hidden; flex:1; min-width:0;"><span class="top5-rank">${idx+1}</span><span class="top5-name" title="${item.name} (${item.sub})">${item.name}</span></div><span class="top5-val">${formatted}</span></div>`;
                    });
                    cardHTML += `</div></div>`; gridContainer.innerHTML += cardHTML;
                });
            } else {
                const coMap = {};
                rawData.forEach(d => { const coName = d['co'] || 'Unknown Co'; if (!coMap[coName]) { coMap[coName] = {}; metrics.forEach(m => coMap[coName][m.key] = 0); } metrics.forEach(m => { coMap[coName][m.key] += parseFloat(d[m.key + '_mtd'] || 0); }); });
                metrics.forEach(m => {
                    let coData = Object.keys(coMap).map(coName => ({ name: coName, sub: 'Region Sumatera', val: coMap[coName][m.key] }));
                    coData = coData.filter(item => item.val > 0); coData.sort((a, b) => b.val - a.val); const topN = coData.slice(0, 5);
                    if (topN.length === 0) return;
                    let cardHTML = `<div class="top5-card"><div class="top5-header" title="${m.label}"><i class="fas ${m.icon}"></i> ${m.label}</div><div class="top5-list">`;
                    topN.forEach((item, idx) => {
                        const isGrowth = ['ca','sa','fu'].includes(m.key); const formatted = formatValue(item.val, m.unit, isGrowth, false, false);
                        cardHTML += `<div class="top5-item"><div style="display:flex; align-items:center; overflow:hidden; flex:1; min-width:0;"><span class="top5-rank">${idx+1}</span><span class="top5-name" title="${item.name}">${item.name}</span></div><span class="top5-val">${formatted}</span></div>`;
                    });
                    cardHTML += `</div></div>`; gridContainer.innerHTML += cardHTML;
                });
            }
        }

        function captureDashboard() {
            const btn = document.querySelector('.header-actions .capture-toggle');
            const originalIcon = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            btn.disabled = true;

            const headerElement = document.querySelector('.header');
            const dashboardElement = document.getElementById('dashboardContainer');
            const footerElement = document.querySelector('.footer');
            
            const captureWrapper = document.createElement('div');
            captureWrapper.style.backgroundColor = getComputedStyle(document.body).getPropertyValue('--bg');
            captureWrapper.style.padding = '5px';
            captureWrapper.style.width = '100%';
            captureWrapper.style.display = 'flex';
            captureWrapper.style.flexDirection = 'column';
            
            const headerClone = headerElement.cloneNode(true);
            const dashClone = dashboardElement.cloneNode(true);
            const footerClone = footerElement.cloneNode(true);
            
            headerClone.style.position = 'relative';
            headerClone.style.top = '0';
            headerClone.style.marginBottom = '20px';
            headerClone.style.borderRadius = '8px';
            const actionsClone = headerClone.querySelector('.header-actions');
            if(actionsClone) actionsClone.style.display = 'none';

            footerClone.style.marginTop = '15px';
            footerClone.style.paddingTop = '10px';
            footerClone.style.borderTop = '1px solid ' + getComputedStyle(document.body).getPropertyValue('--border');

            captureWrapper.appendChild(headerClone);
            captureWrapper.appendChild(dashClone);
            captureWrapper.appendChild(footerClone);
            
            captureWrapper.style.position = 'fixed';
            captureWrapper.style.left = '-9999px';
            document.body.appendChild(captureWrapper);

            const regionText = document.getElementById('headerSubtitle').innerText.replace(/\s+/g, '_');
            const dateText = currentActiveJson.label;
            const fileName = `KPI_${regionText}_${dateText}.png`;

            html2canvas(captureWrapper, { scale: 2, useCORS: true, backgroundColor: null, logging: false }).then(canvas => {
                const link = document.createElement('a');
                link.download = fileName;
                link.href = canvas.toDataURL('image/png');
                link.click();
                document.body.removeChild(captureWrapper);
                btn.innerHTML = originalIcon;
                btn.disabled = false;
            }).catch(err => {
                console.error("Capture failed:", err);
                alert("Gagal mengambil gambar dashboard.");
                document.body.removeChild(captureWrapper);
                btn.innerHTML = originalIcon;
                btn.disabled = false;
            });
        }

        function captureRanking() {
            const btn = document.querySelector('.modal-capture-btn');
            const originalIcon = btn.innerHTML;
            const modalContent = document.getElementById('rankingModalContent');
            const modalBody = document.getElementById('rankingModalBody');
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            btn.disabled = true;

            const originalStyles = {
                maxHeight: modalContent.style.maxHeight,
                height: modalContent.style.height,
                overflow: modalBody.style.overflow,
                transform: modalContent.style.transform,
                animation: modalContent.style.animation
            };

            modalContent.style.maxHeight = 'none';
            modalContent.style.height = 'auto';
            modalContent.style.transform = 'none';
            modalContent.style.animation = 'none';
            modalBody.style.overflow = 'visible';

            const closeBtn = modalContent.querySelector('.close-btn');
            const capBtn = modalContent.querySelector('.modal-capture-btn');
            if(closeBtn) closeBtn.style.visibility = 'hidden';
            if(capBtn) capBtn.style.visibility = 'hidden';

            const modeLabel = currentRankingMode === 'top5branch' ? 'Top5_Branch' : 'Top5_CoBranch';
            const dateText = currentActiveJson.label;
            const fileName = `Ranking_${modeLabel}_${dateText}.png`;
            
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const bgColor = isDark ? '#16213e' : '#ffffff';

            html2canvas(modalContent, { 
                scale: 2, 
                useCORS: true, 
                backgroundColor: bgColor,
                logging: false,
                scrollY: -window.scrollY,
                windowHeight: document.documentElement.clientHeight,
                foreignObjectRendering: false,
                imageTimeout: 0,
                removeContainer: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = fileName;
                link.href = canvas.toDataURL('image/png');
                link.click();

                modalContent.style.maxHeight = originalStyles.maxHeight;
                modalContent.style.height = originalStyles.height;
                modalContent.style.transform = originalStyles.transform;
                modalContent.style.animation = originalStyles.animation;
                modalBody.style.overflow = originalStyles.overflow;
                if(closeBtn) closeBtn.style.visibility = 'visible';
                if(capBtn) {
                    capBtn.style.visibility = 'visible';
                    capBtn.innerHTML = originalIcon;
                    capBtn.disabled = false;
                }
            }).catch(err => {
                console.error("Ranking capture failed:", err);
                alert("Gagal mengambil gambar ranking.");
                
                modalContent.style.maxHeight = originalStyles.maxHeight;
                modalContent.style.height = originalStyles.height;
                modalContent.style.transform = originalStyles.transform;
                modalContent.style.animation = originalStyles.animation;
                modalBody.style.overflow = originalStyles.overflow;
                if(closeBtn) closeBtn.style.visibility = 'visible';
                if(capBtn) {
                    capBtn.style.visibility = 'visible';
                    capBtn.innerHTML = originalIcon;
                    capBtn.disabled = false;
                }
            });
        }

        // PERBAIKAN FINAL: Menggunakan window.onclick sederhana
        // Sidebar TIDAK AKAN tertutup oleh klik apapun selain tombol X
        window.onclick = function(e) { 
            if (e.target == document.getElementById('rankingModal')) {
                closeRankingModal(); 
            }
            // Tidak ada logika penutupan sidebar di sini sama sekali.
            // Overlay (#sidebarOverlay) sudah tidak punya onclick, 
            // dan dropdown select tidak akan memicu penutupan.
        }

        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || (e.ctrlKey && e.key === 'u') || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && e.key === 's')) {
                e.preventDefault(); return false;
            }
        });
        setInterval(function() {
            if (window.outerWidth - window.innerWidth > 160 || window.outerHeight - window.innerHeight > 160) console.clear();
        }, 1000);        
    </script>
</body>
